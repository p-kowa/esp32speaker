[platformio]
default_envs = esp32-s3-n16r8_DE

[esp32-s3-n16r8]
monitor_dtr = 0
monitor_rts = 0
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf, arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = n16r8_part.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    ; muss zur Kompilierung von esp-tflite-micro passen (Tensor-Struct-Layout)
    -DTF_LITE_STATIC_MEMORY
lib_deps = 
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/kahrendt/ESPMicroSpeechFeatures.git#v1.1.0

[env:esp32-s3-n16r8_DE]
extends = esp32-s3-n16r8
build_flags =
    ${esp32-s3-n16r8.build_flags}
    -DUI_LANG=LANG_DE

[env:esp32-s3-n16r8_EN]
extends = esp32-s3-n16r8
build_flags =
    ${esp32-s3-n16r8.build_flags}
    -DUI_LANG=LANG_EN

[env:esp32-s3-n16r8_PL]
extends = esp32-s3-n16r8
build_flags =
    ${esp32-s3-n16r8.build_flags}
    -DUI_LANG=LANG_PL
[platformio]
default_envs = esp32-s3-devkitc-1_DE

[esp32_base]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    knolleary/PubSubClient@^2.8

[env:esp32-s3-devkitc-1_DE]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DUI_LANG=LANG_DE

[env:esp32-s3-devkitc-1_EN]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DUI_LANG=LANG_EN

[env:esp32-s3-devkitc-1_PL]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DUI_LANG=LANG_PL